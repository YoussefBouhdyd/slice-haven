image: python:3.13

stages:
  - build
  - test
  - docker-build-push
  - scan 

variables:
  CI_REGISTRY_IMAGE: registry.gitlab.com/youssefbouhdyd/slice-haven

cache:
  paths:
    - ~/.cache/pip

build:
  stage: build
  script:
    - echo "#1| App Building"
    - pip install -r requirements.txt


test:
  stage: test
  script:
    - echo "#2| App Testing"
    - pip install -r requirements.txt
    - pytest -v

docker_build_push:
  stage: docker-build-push
  image: docker:24
  services:
    - docker:24-dind
  # variables:
  #   DOCKER_TLS_CERTDIR: ""
  script:
   - echo "#3| Building Docker Image"
   - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
   - echo "#4| Pusing Docker Image"
   - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
   - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  
scan:
  stage: scan
  image: aquasec/trivy:latest
  services:
    - docker:24-dind
  script:
    - trivy image $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA