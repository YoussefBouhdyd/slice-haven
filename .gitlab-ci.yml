image: python:3.13

stages:
  - build
  - test
  - docker-build

variables:
  ACR_NAME: sliceacr
  ACR_LOGIN_SERVER: sliceacr.azurecr.io
  RESOURCE_GROUP: rg-slice
  WEBAPP_NAME: slice-haven
  DOCKER_IMAGE_TAG: latest

cache:
  paths:
    - ~/.cache/pip

build:
  stage: build
  script:
    - echo "building ..."
    - pip install -r requirements.txt


test:
  stage: test
  script:
    - echo "testing ..."
    - pip install -r requirements.txt
    - pytest -v

docker_build:
  image: docker:29.1.3
  stage: docker-build
  services:
    - docker:24-dind
  script:
    - echo "Logging in to Azure..."
    - az login --service-principal -u $appId -p $password --tenant $tenant
    - az acr login --name $ACR_NAME
    - echo "building docker image"
    - docker build -t $ACR_LOGIN_SERVER/$APP_NAME:$DOCKER_IMAGE_TAG .
    - docker push $ACR_LOGIN_SERVER/$APP_NAME:$DOCKER_IMAGE_TAG

