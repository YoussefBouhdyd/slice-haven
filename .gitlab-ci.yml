image: python:3.13

stages:
  - build
  - test
  - quality-scan-with-sonarQube
  - docker-build-push
  - scan 
  - deploy 

variables:
  IMG_TAG: registry.gitlab.com/youssefbouhdyd/slice-haven
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

cache:
  paths:
    - ~/.cache/pip

build:
  stage: build
  script:
    - echo "#1| App Building"
    - pip install -r requirements.txt


test:
  stage: test
  script:
    - echo "#2| App Testing"
    - pip install -r requirements.txt
    - pytest -v

code-quality:
  stage: quality-scan-with-sonarQube
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  only:
    - merge_requests
    - master
    - develop


docker_build_push:
  stage: docker-build-push
  image: docker:24
  services:
    - docker:24-dind
  script:
    - echo "Login To Azure"
    - echo "$ACR_PASSWORD" | docker login $ACR_LOGIN_SERVER -u $ACR_USERNAME --password-stdin
    - echo "Login To GitLab Registry"
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - echo "#3| Building Docker Image"
    - docker build -t $ACR_LOGIN_SERVER/slice-haven:$CI_COMMIT_SHORT_SHA -t $IMG_TAG:$CI_COMMIT_SHORT_SHA .
    - echo "#4| Pushing Docker Image"
    - echo "Push to ACR"
    - docker push $ACR_LOGIN_SERVER/slice-haven:$CI_COMMIT_SHORT_SHA
    - echo "Push to GitLab Registry"
    - docker push $IMG_TAG:$CI_COMMIT_SHORT_SHA
  
scan:
  stage: scan
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA


deploy_to_azure:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  script:
    - az login --service-principal -u $appId -p $password --tenant $tenant
    - az webapp config container set --name slice-haven --resource-group rg-slice --docker-custom-image-name $ACR_LOGIN_SERVER/slice-haven:$CI_COMMIT_SHORT_SHA --docker-registry-server-url https://$ACR_LOGIN_SERVER
