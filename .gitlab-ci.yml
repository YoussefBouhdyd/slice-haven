image: python:3.13

stages:
  - build
  - test
  - docker-build

cache:
  paths:
    - ~/.cache/pip

build:
  stage: build
  script:
    - echo "building ..."
    - pip install -r requirements.txt


test:
  stage: test
  script:
    - echo "testing ..."
    - pip install -r requirements.txt
    - pytest -v

docker_build:
  image: docker:29.1.3
  stage: docker-build
  script:
    - echo "building docker image"
    - docker build -t slice .