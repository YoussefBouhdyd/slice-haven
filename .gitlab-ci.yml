image: python:3.13

stages:
  - build
  - test
  - docker-build

variables:
  CI_REGISTRY_IMAGE: registry.gitlab.com/YoussefBouhdyd/slice-haven

cache:
  paths:
    - ~/.cache/pip

build:
  stage: build
  script:
    - echo "#1| App Building"
    - pip install -r requirements.txt


test:
  stage: test
  script:
    - echo "#2| App Testing"
    - pip install -r requirements.txt
    - pytest -v

docker_build:
  stage: docker-build
  image: docker:24
  services:
    - docker:24-dind
  # variables:
  #   DOCKER_TLS_CERTDIR: ""
  script:
   - echo "#3 Building Docker Image"
   - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .